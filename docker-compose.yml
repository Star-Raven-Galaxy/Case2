services:
  db:
    image: postgres:14-alpine
    container_name: equipment-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-equipment}
      POSTGRES_USER: ${DB_USER:-equipment}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-equipment}
      POSTGRES_HOST_AUTH_METHOD: md5
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-equipment} -d ${DB_NAME:-equipment}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: